schema_version: "1.1"
name: backend-audit
description: Audit mode on an intentionally vulnerable Express API; checks coverage, verdict, key findings and secret hygiene.
tags: [audit, backend]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    sample-app/api klasöründeki backend'i gelecek hafta canlıya çıkarıyoruz. Prod'a hazır mı? Denetle ve raporla. (sample-app/web onun frontend'i.) Hiçbir dosyayı değiştirme.
