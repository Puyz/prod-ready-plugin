schema_version: "1.1"
name: frontend-audit
description: Audit mode on an intentionally flawed Next.js site; checks coverage, verdict, key findings and secret hygiene.
tags: [audit, frontend]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    sample-app/web bizim Türkiye ve AB'ye yönelik tanıtım sitemiz (login de var), gelecek hafta yayına çıkıyor. Frontend yayına hazır mı? Denetle ve raporla. Hiçbir dosyayı değiştirme.
